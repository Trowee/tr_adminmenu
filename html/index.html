<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TR Admin</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./components/quickmenu/index.css" />
    <link rel="stylesheet" href="./components/adminpanel/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="./lib/vue.global.prod.js"></script>
    <script src="./lib/vuex.global.prod.js"></script>
    <script src="./utils/postNui.js"></script>
</head>
<body>
    <div id="app" style="display:none">
        <Transition name="slide">
            <div v-if="notification && notification.text" class="notification-toast" :class="notification.type">
                <i
                    :class="notification.type === 'success' ? 'fas fa-check-circle' : notification.type === 'error' ? 'fas fa-times-circle' : 'fas fa-info-circle'"></i>
                <span>{{ notification.text }}</span>
            </div>
        </Transition>
        <quickmenu v-if="showQuickMenu"></quickmenu>
        <adminpanel v-if="showAdminPanel" :key="adminPanelKey"></adminpanel>
        <div v-if="showDMReceiveModal" class="modal-overlay" style="background:rgba(0,0,0,0.8);z-index:9999;">
            <div class="modal-box" style="width:500px;border:2px solid var(--accent);">
                <div style="text-align:center;margin-bottom:20px;">
                    <i class="fas fa-envelope-open-text"
                        style="font-size:48px;color:var(--accent);margin-bottom:10px;"></i>
                    <h2 style="font-size:24px;color:var(--accent-light);">{{ t('ui_dm_title') }}</h2>
                    <p style="color:var(--text-muted);font-size:14px;">{{ dmReceiveData.admin }}</p>
                </div>
                <div
                    style="background:rgba(255,255,255,0.05);padding:20px;border-radius:var(--radius-md);margin-bottom:20px;font-size:16px;line-height:1.6;color:white;text-align:center;">
                    {{ dmReceiveData.message }}
                </div>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn-action btn-primary" @click="closeDMReceiveModal"
                        style="padding:10px 30px;font-size:14px;">{{ t('ui_acknowledge') }}</button>
                </div>
            </div>
        </div>
        <div v-if="showWarnModal" class="modal-overlay" style="background:rgba(239,68,68,0.2);z-index:9999;">
            <div class="modal-box"
                style="width:500px;border:2px solid var(--danger);box-shadow:0 0 50px rgba(239,68,68,0.3);">
                <div style="text-align:center;margin-bottom:20px;">
                    <i class="fas fa-exclamation-triangle"
                        style="font-size:48px;color:var(--danger);margin-bottom:10px;"></i>
                    <h2 style="font-size:24px;color:#FCA5A5;">{{ t('ui_warn_title') }}</h2>
                    <p style="color:var(--text-muted);font-size:14px;">Admin: {{ warnModalData.admin }}</p>
                </div>
                <div
                    style="background:rgba(239,68,68,0.1);padding:20px;border-radius:var(--radius-md);margin-bottom:20px;font-size:18px;line-height:1.6;color:white;text-align:center;font-weight:600;border:1px solid rgba(239,68,68,0.3);">
                    {{ warnModalData.reason }}
                </div>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn-action btn-danger" @click="closeWarnModal"
                        style="padding:10px 30px;font-size:14px;">{{ t('ui_i_understand') }}</button>
                </div>
            </div>
        </div>
        <div v-if="showAnnouncementReceive" class="announcement-banner">
            <div class="announcement-banner-inner">
                <i class="fas fa-bullhorn" style="font-size:32px;color:#3B82F6;margin-right:18px;"></i>
                <div style="flex:1;text-align:center;">
                    <div style="font-size:22px;font-weight:800;color:white;margin-bottom:4px;letter-spacing:0.3px;">{{
                        announcementData.text }}</div>
                    <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;">{{ t('ui_from') }} {{
                        announcementData.admin }}</div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/x-template" id="quickmenu-template">
    <div class="quick-menu-overlay">
        <div class="quick-menu" style="position:relative;">
            <div class="qm-header">
                <div class="qm-header-title">
                    <div class="logo"><i class="fas fa-shield-alt" style="font-size:24px;color:var(--accent-light);"></i></div>
                    <div>
                        <h2>{{ t('ui_admin_menu') }}</h2>
                        <p>{{ serverName }} - {{ t('ui_quick_actions') }}</p>
                    </div>
                </div>
                <div class="qm-close" @click="closeMenu"><i class="fas fa-times"></i></div>
            </div>
            <div class="qm-actions-grid">
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.noclip }" @click="myPermissions.noclip && doAction('noclip')">
                    <div class="icon purple"><i class="fas fa-bolt"></i></div>
                    <span>{{ t('ui_qm_noclip') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.goto_player }" @click="myPermissions.goto_player && openIdPopup('goto')">
                    <div class="icon blue"><i class="fas fa-map-marker-alt"></i></div>
                    <span>{{ t('ui_qm_goto') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.bring }" @click="myPermissions.bring && openIdPopup('bring')">
                    <div class="icon cyan"><i class="fas fa-user"></i></div>
                    <span>{{ t('ui_qm_bring') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.spawn_vehicle }" @click="myPermissions.spawn_vehicle && doAction('spawnvehicle')">
                    <div class="icon yellow"><i class="fas fa-car"></i></div>
                    <span>{{ t('ui_qm_spawn') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.manage_vehicles }" @click="myPermissions.manage_vehicles && doAction('dv')">
                    <div class="icon red"><i class="fas fa-trash"></i></div>
                    <span>{{ t('ui_qm_dv') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.manage_vehicles }" @click="myPermissions.manage_vehicles && doAction('fix')">
                    <div class="icon green"><i class="fas fa-wrench"></i></div>
                    <span>{{ t('ui_qm_fix') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.heal }" @click="myPermissions.heal && openIdPopup('heal')">
                    <div class="icon green"><i class="fas fa-heart"></i></div>
                    <span>{{ t('ui_qm_heal') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.revive }" @click="myPermissions.revive && openIdPopup('revive')">
                    <div class="icon cyan"><i class="fas fa-heartbeat"></i></div>
                    <span>{{ t('ui_qm_revive') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.teleport }" @click="myPermissions.teleport && doAction('tpm')">
                    <div class="icon red"><i class="fas fa-crosshairs"></i></div>
                    <span>{{ t('ui_qm_tpm') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.kick }" @click="myPermissions.kick && openIdPopup('kick')">
                    <div class="icon red"><i class="fas fa-user-slash"></i></div>
                    <span>{{ t('ui_qm_kick') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.kill }" @click="myPermissions.kill && openIdPopup('kill')">
                    <div class="icon red"><i class="fas fa-skull"></i></div>
                    <span>{{ t('ui_qm_kill') }}</span>
                </div>
                <div class="qm-action-btn" :class="{ disabled: !myPermissions.send_announcement }" @click="myPermissions.send_announcement && openAnnouncementPopup()">
                    <div class="icon blue"><i class="fas fa-bullhorn"></i></div>
                    <span>{{ t('ui_qm_announce') }}</span>
                </div>
            </div>
            <div v-if="announcementPopup" class="qm-id-popup-overlay">
                <div class="qm-id-popup">
                    <h3>{{ t('ui_send_announcement') }}</h3>
                    <input class="input-field" type="text" v-model="announcementText" :placeholder="t('ui_msg_placeholder')" />
                    <div class="qm-popup-actions">
                        <button class="btn-action btn-ghost" @click="announcementPopup = false; announcementText = ''">{{ t('ui_cancel') }}</button>
                        <button class="btn-action btn-primary" @click="sendQMAnnouncement" :disabled="!announcementText">{{ t('ui_send') }}</button>
                    </div>
                </div>
            </div>
            <div v-if="idPopup.show" class="qm-id-popup-overlay">
                <div class="qm-id-popup">
                    <h3>{{ idPopup.action }} - {{ t('ui_enter_player_id') }}</h3>
                    <input class="input-field" type="number" v-model="idPopup.inputId" @input="lookupPlayer" :placeholder="t('ui_player_id_placeholder')" min="1" />
                    <div v-if="foundPlayer" class="qm-player-card">
                        <div class="avatar">
                            <img v-if="foundPlayer.avatar" :src="foundPlayer.avatar" />
                            <span v-else>{{ foundPlayer.name ? foundPlayer.name.charAt(0).toUpperCase() : '?' }}</span>
                        </div>
                        <div class="info">
                            <h4>{{ foundPlayer.name }}</h4>
                            <p>ID: {{ foundPlayer.id }} | {{ foundPlayer.job || 'Unemployed' }}</p>
                        </div>
                    </div>
                    <p v-else-if="idPopup.inputId && idPopup.inputId.length > 0" class="no-player-text">{{ t('ui_no_player_found') }} {{ idPopup.inputId }}</p>
                    <div class="qm-popup-actions">
                        <button class="btn-action btn-ghost" @click="closeIdPopup">{{ t('ui_cancel') }}</button>
                        <button class="btn-action btn-primary" @click="confirmAction" :disabled="!foundPlayer">{{ t('ui_confirm') }}</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </script>
    <script type="text/x-template" id="adminpanel-template">
    <div class="admin-panel-overlay" @click.self="closePanel">
        <div class="admin-panel">
            <div class="ap-sidebar">
                <div class="ap-sidebar-brand">
                    <div class="brand-icon"><i class="fas fa-shield-alt" style="font-size:22px;color:var(--accent-light);"></i></div>
                    <div>
                        <h1>{{ serverName }}</h1>
                        <p>{{ t('ui_admin_panel') }}</p>
                    </div>
                </div>
                <div class="ap-nav">
                    <div class="ap-nav-section">{{ t('ui_nav_main') }}</div>
                    <div class="ap-nav-item" :class="{active: tab === 'home'}" @click="tab = 'home'" v-if="sections.home">
                        <div class="nav-icon"><i class="fas fa-home"></i></div> {{ t('ui_nav_home') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'players'}" @click="tab = 'players'; selectedPlayerId = null" v-if="sections.players">
                        <div class="nav-icon"><i class="fas fa-users"></i></div> {{ t('ui_nav_players') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'offline_players'}" @click="tab = 'offline_players'" v-if="sections.offline_players">
                        <div class="nav-icon"><i class="fas fa-user-clock"></i></div> {{ t('ui_nav_offline_players') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'vehicles'}" @click="tab = 'vehicles'" v-if="sections.vehicles">
                        <div class="nav-icon"><i class="fas fa-car-side"></i></div> {{ t('ui_nav_vehicles') }}
                    </div>
                    <div class="ap-nav-section">{{ t('ui_nav_moderation') }}</div>
                    <div class="ap-nav-item" :class="{active: tab === 'ban'}" @click="tab = 'ban'" v-if="sections.bans">
                        <div class="nav-icon"><i class="fas fa-ban"></i></div> {{ t('ui_nav_bans') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'spectate'}" @click="tab = 'spectate'" v-if="sections.spectate">
                        <div class="nav-icon"><i class="fas fa-eye"></i></div> {{ t('ui_nav_spectate') }}
                    </div>
                    <div class="ap-nav-section">{{ t('ui_nav_system') }}</div>
                    <div class="ap-nav-item" :class="{active: tab === 'logs'}" @click="tab = 'logs'" v-if="sections.logs">
                        <div class="nav-icon"><i class="fas fa-file-alt"></i></div> {{ t('ui_nav_logs') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'admins'}" @click="tab = 'admins'" v-if="sections.admins">
                        <div class="nav-icon"><i class="fas fa-shield-alt"></i></div> {{ t('ui_nav_admins') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'staffchat'}" @click="tab = 'staffchat'" v-if="sections.staffchat">
                        <div class="nav-icon"><i class="fas fa-comments"></i></div> {{ t('ui_nav_staff_chat') }}
                    </div>
                    <div class="ap-nav-section" v-if="sections.client_executor || sections.manage_resources">{{ t('ui_nav_developer') }}</div>
                    <div class="ap-nav-item" :class="{active: tab === 'client_executor'}" @click="tab = 'client_executor'" v-if="sections.client_executor">
                        <div class="nav-icon"><i class="fas fa-terminal"></i></div> {{ t('ui_nav_executor') }}
                    </div>
                    <div class="ap-nav-item" :class="{active: tab === 'manage_resources'}" @click="tab = 'manage_resources'" v-if="sections.manage_resources">
                        <div class="nav-icon"><i class="fas fa-cubes"></i></div> {{ t('ui_nav_resources') }}
                    </div>
                    <div style="flex:1;"></div>
                </div>
                <div class="ap-sidebar-footer">
                    <div class="admin-info">
                        <div class="admin-avatar" style="border-radius: 4px; overflow: hidden;">
                            <img v-if="myAvatar" :src="myAvatar" style="width:100%;height:100%;object-fit:cover;" />
                            <span v-else>{{ myName ? myName.charAt(0).toUpperCase() : 'A' }}</span>
                        </div>
                        <div>
                            <div class="admin-name">{{ myName || 'Admin' }}</div>
                            <div class="admin-role">{{ myGroup || 'admin' }}</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ap-content">
                <template v-if="tab === 'home'">
                    <div class="ap-content-header">
                        <div><h2>{{ t('ui_dashboard') }}</h2><p>{{ t('ui_server_analytics') }}</p></div>
                        <div class="header-actions">
                            <button class="btn-action btn-ghost" @click="refreshAnalytics" title="Refresh Analytics">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                            <span class="badge badge-green"><i class="fas fa-circle" style="font-size:6px;margin-right:4px;"></i> {{ t('ui_online') }}</span>
                            <span style="font-size:11px;color:var(--text-muted);">{{ currentTime }}</span>
                        </div>
                    </div>
                    <div class="ap-content-body" style="overflow-y:hidden; display:flex; flex-direction:column; gap:20px; padding-bottom:10px;">
                        <div class="dash-stats-row" style="flex:0 0 auto;">
                            <div class="dash-stat-pill green">
                                <i class="fas fa-users"></i>
                                <div class="dash-stat-pill-info"><span class="dash-stat-pill-val">{{ onlineCount }}</span><span class="dash-stat-pill-label">{{ t('ui_online') }}</span></div>
                            </div>
                            <div class="dash-stat-pill red">
                                <i class="fas fa-ban"></i>
                                <div class="dash-stat-pill-info"><span class="dash-stat-pill-val">{{ analytics.activeBans }}</span><span class="dash-stat-pill-label">{{ t('ui_active_bans') }}</span></div>
                            </div>
                            <div class="dash-stat-pill purple">
                                <i class="fas fa-user-slash"></i>
                                <div class="dash-stat-pill-info"><span class="dash-stat-pill-val">{{ analytics.totalKicks }}</span><span class="dash-stat-pill-label">{{ t('ui_kicks') }}</span></div>
                            </div>
                            <div class="dash-stat-pill cyan">
                                <i class="fas fa-exclamation-triangle"></i>
                                <div class="dash-stat-pill-info"><span class="dash-stat-pill-val">{{ analytics.totalWarnings }}</span><span class="dash-stat-pill-label">{{ t('ui_warnings') }}</span></div>
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; flex:1; min-height:0;">
                            <div class="dash-col" style="display:flex; flex-direction:column; gap:20px; overflow:hidden;">
                                <div class="dash-card" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                                    <div class="dash-card-header" style="flex:0 0 auto;">
                                        <h3><i class="fas fa-coins" style="color:#F59E0B;margin-right:6px;"></i>{{ t('ui_richest') }}</h3>
                                    </div>
                                    <div class="lb-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;">
                                        <div v-for="(p, i) in analytics.topPlayers.richest" :key="'rich'+i" class="lb-row" style="cursor:pointer; flex: 0 0 auto;" :style="i < 5 ? {flex: '1 0 auto', minHeight: '36px'} : {}" @click="goToPlayerProfile(p.serverId, p.identifier)">
                                            <div class="lb-rank" :class="{'gold': i === 0, 'silver': i === 1, 'bronze': i === 2}">{{ i + 1 }}</div>
                                            <div class="lb-info">
                                                <div class="lb-name">{{ p.name }} <span v-if="p.serverId" style="font-size:10px;color:#10B981;margin-left:4px;"><i class="fas fa-circle"></i></span></div>
                                                <div class="lb-meta" style="color:#10B981;font-weight:bold;">{{ p.value }}</div>
                                            </div>
                                        </div>
                                         <p v-if="!analytics.topPlayers.richest || analytics.topPlayers.richest.length === 0" class="empty-state">{{ t('ui_no_data') }}</p>
                                    </div>
                                </div>
                                <div class="dash-card" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                                    <div class="dash-card-header" style="flex:0 0 auto;">
                                        <h3><i class="fas fa-user-plus" style="color:#3B82F6;margin-right:6px;"></i>{{ t('ui_new_arrivals') }}</h3>
                                    </div>
                                    <div class="lb-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;">
                                         <div v-for="(p, i) in analytics.topPlayers.newest" :key="'new'+i" class="lb-row" style="cursor:pointer; flex: 0 0 auto;" :style="i < 5 ? {flex: '1 0 auto', minHeight: '36px'} : {}" @click="goToPlayerProfile(p.serverId, p.identifier)">
                                            <div class="lb-rank" style="background:rgba(59,130,246,0.1);color:#3B82F6;font-size:10px;"><i class="fas fa-user"></i></div>
                                            <div class="lb-info">
                                                <div class="lb-name">{{ p.name }} <span v-if="p.serverId" style="font-size:10px;color:#10B981;margin-left:4px;"><i class="fas fa-circle"></i></span></div>
                                                <div class="lb-meta" style="color:#94A3B8;">{{ t('ui_welcome') }}</div>
                                            </div>
                                        </div>
                                        <p v-if="!analytics.topPlayers.newest || analytics.topPlayers.newest.length === 0" class="empty-state">{{ t('ui_no_data') }}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="dash-card" style="display:flex; flex-direction:column; padding:20px; overflow:hidden;">
                                <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex:0 0 auto;">
                                    <h3><i class="fas fa-chart-bar" style="color:#10B981;margin-right:6px;"></i>{{ t('ui_job_distribution') }}</h3>
                                    <span class="badge badge-green">{{ t('ui_all') }}</span>
                                </div>
                                <div class="job-list-scroll" style="flex:1; overflow-y:auto; padding-right:5px; display:flex; flex-direction:column; justify-content:flex-start; gap:8px;">
                                    <div v-for="(job, i) in analytics.jobStats" :key="i" style="display:flex; align-items:center; gap:12px; font-size:13px; min-height:20px;">
                                        <div style="width:110px; text-transform:uppercase; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left;" :title="job.name">{{ job.name }}</div>
                                        <div style="flex:1; background:rgba(255,255,255,0.05); height:12px; border-radius:6px; overflow:hidden;">
                                            <div :style="{
                                                width: (job.count / (analytics.jobStats[0] ? analytics.jobStats[0].count : 1) * 100) + '%', 
                                                height: '100%', 
                                                background: i < 5 ? ['#10B981', '#3B82F6', '#F59E0B', '#EF4444', '#8B5CF6'][i] : '#6B7280',
                                                borderRadius: '6px',
                                                transition: 'width 0.5s ease'
                                            }"></div>
                                        </div>
                                        <div style="width:30px; text-align:right; font-weight:bold; color:white;">{{ job.count }}</div>
                                    </div>
                                     <p v-if="!analytics.jobStats || analytics.jobStats.length === 0" class="empty-state" style="margin:auto;">{{ t('ui_no_job_data') }}</p>
                                </div>
                            </div>
                            <div class="dash-col" style="display:flex; flex-direction:column; gap:20px; overflow:hidden;">
                                <div class="dash-card" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                                    <div class="dash-card-header" style="flex:0 0 auto;">
                                        <h3><i class="fas fa-user-shield" style="color:#10B981;margin-right:6px;"></i>{{ t('ui_online_staff') }}</h3>
                                        <span class="badge badge-green">{{ onlineAdmins.length }} {{ t('ui_active') }}</span>
                                    </div>
                                    <div class="lb-list" style="flex:1; overflow-y:auto;">
                                        <div v-for="admin in onlineAdmins" :key="admin.id" class="lb-row">
                                            <div class="lb-rank" style="background:rgba(16,185,129,0.1);color:#10B981;">
                                                <i class="fas fa-circle" style="font-size:6px;"></i>
                                            </div>
                                            <div class="lb-info">
                                                <div class="lb-name">{{ admin.name }}</div>
                                                <div class="lb-meta">
                                                    <span>{{ admin.group }}</span>
                                                    <span v-if="admin.duty" style="color:#10B981;margin-left:4px;">{{ t('ui_on_duty') }}</span>
                                                    <span v-else style="color:#EF4444;margin-left:4px;">{{ t('ui_off_duty') }}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <p v-if="!onlineAdmins || onlineAdmins.length === 0" class="empty-state">{{ t('ui_no_staff_online') }}</p>
                                    </div>
                                </div>
                                <div class="dash-card" style="flex:0 0 auto; padding:15px;">
                                    <h3 style="font-size:14px; margin-bottom:15px;"><i class="fas fa-calendar-week" style="color:#8B5CF6;margin-right:6px;"></i>{{ t('ui_weekly_stats') }}</h3>
                                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center;">
                                        <div style="background:rgba(239,68,68,0.1); border-radius:6px; padding:8px;">

            <div class="modal-box">
                <h3><i class="fas fa-envelope"></i> {{ t('ui_direct_message') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_message') }}</div><textarea class="input-field w-full" v-model="actionForm.dmMessage" :placeholder="t('ui_type_message_here')" rows="3"></textarea></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="activeActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="doSendDM">{{ t('ui_send') }}</button></div>
            </div>
        </div>
        <div v-if="activeActionModal === 'removeitem_confirm'" class="modal-overlay" @click.self="activeActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-trash"></i> {{ t('ui_remove') }} {{ actionForm.itemLabel || actionForm.itemName }}?</h3>
                <p style="margin-bottom:12px;color:var(--text-secondary);">{{ t('ui_remove_confirm') }}</p>
                <div class="form-group"><div class="form-label">{{ t('ui_count') }} (Max: {{ actionForm.itemMax }})</div><input class="input-field w-full" v-model="actionForm.itemCount" type="number" min="1" :max="actionForm.itemMax" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="activeActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-danger" @click="doRemoveItemConfirm">{{ t('ui_confirm_remove') }}</button></div>
            </div>
        </div>
        <div v-if="activeActionModal === 'warn'" class="modal-overlay" @click.self="activeActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-exclamation-triangle"></i> {{ t('ui_warn_player') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_reason') }}</div><input class="input-field w-full" v-model="actionForm.warnReason" :placeholder="t('ui_warning_reason')" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="activeActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-danger" @click="doWarn">{{ t('ui_issue_warning') }}</button></div>
            </div>
        </div>
        <div v-if="showScreenshotModal" class="modal-overlay" @click.self="showScreenshotModal = false" style="background:rgba(0,0,0,0.9);z-index:9999;">
            <div class="screenshot-modal-box">
                <div class="screenshot-modal-header">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <i class="fas fa-camera" style="color:var(--accent-light);"></i>
                        <span style="font-weight:700;font-size:16px;color:white;">{{ t('ui_screenshot') }}</span>
                    </div>
                    <button class="btn-action btn-ghost" @click="showScreenshotModal = false" style="padding:6px 12px;font-size:12px;">
                        <i class="fas fa-times"></i> {{ t('ui_close') || 'Close' }}
                    </button>
                </div>
                <div class="screenshot-modal-body">
                    <img v-if="screenshotImage" :src="screenshotImage" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.5);" />
                    <div v-else style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px;">
                        <i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Capturing...
                    </div>
                </div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'setjob'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box" style="width: 400px;">
                <h3><i class="fas fa-briefcase"></i> {{ t('ui_set_offline_job') }}</h3>
                <div class="form-group">
                    <div class="form-label">{{ t('ui_job_name') }}</div>
                    <input class="input-field w-full" type="text" v-model="offlineJobSearch" :placeholder="t('ui_search_jobs')" />
                    <div v-if="filteredOfflineJobs.length > 0" class="dropdown-list" style="max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.3);margin-top:5px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);">
                        <div v-for="job in filteredOfflineJobs" :key="job.name" class="dropdown-item" @click="selectOfflineJob(job)" style="padding:8px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);">
                            {{ job.label }} <span style="font-size:10px;opacity:0.6;">({{ job.name }})</span>
                        </div>
                    </div>
                </div>
                <div v-if="offlineActionForm.job" class="form-group">
                    <div class="form-label">{{ t('ui_grade') }}</div>
                    <select v-if="selectedOfflineJobGrades.length > 0" class="input-field w-full" v-model.number="offlineActionForm.grade">
                        <option v-for="g in selectedOfflineJobGrades" :key="g.grade" :value="g.grade">
                            {{ g.label }} ({{ g.grade }})
                        </option>
                    </select>
                    <input v-else class="input-field w-full" v-model.number="offlineActionForm.grade" placeholder="Grade Number" type="number" />
                </div>
                <div class="modal-actions">
                    <button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button>
                    <button class="btn-action btn-primary" @click="offlineDoSetJob" :disabled="!offlineActionForm.job">{{ t('ui_set_job') }}</button>
                </div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'setgroup'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-users-cog"></i> {{ t('ui_set_offline_group') }}</h3>
                <div class="form-group">
                    <div class="form-label">{{ t('ui_group_name') }}</div>
                    <select v-if="availableGroups && availableGroups.length > 0" class="input-field w-full" v-model="offlineActionForm.group">
                        <option value="" disabled selected>Select a group...</option>
                        <option v-for="g in availableGroups" :key="g.name" :value="g.name">
                            {{ g.label }} (Rank {{ g.rank }})
                        </option>
                    </select>
                    <input v-else class="input-field w-full" v-model="offlineActionForm.group" placeholder="Group Name (e.g. admin)" />
                </div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="offlineDoSetGroup">{{ t('ui_set_group') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'setmoney'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-dollar-sign"></i> {{ t('ui_set_offline_money') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_type') }}</div><select class="input-field w-full" v-model="offlineActionForm.moneyType"><option value="money">{{ t('ui_cash') }}</option><option value="bank">{{ t('ui_bank') }}</option><option value="black_money">{{ t('ui_black_money') }}</option></select></div>
                <div class="form-group"><div class="form-label">{{ t('ui_amount') }}</div><input class="input-field w-full" v-model.number="offlineActionForm.amount" :placeholder="t('ui_amount_placeholder')" type="number" min="0" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="offlineDoSetMoney">{{ t('ui_apply') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'removemoney'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-minus-circle"></i> {{ t('ui_remove_offline_money') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_type') }}</div><select class="input-field w-full" v-model="offlineActionForm.moneyType"><option value="money">{{ t('ui_cash') }}</option><option value="bank">{{ t('ui_bank') }}</option><option value="black_money">{{ t('ui_black_money') }}</option></select></div>
                <div class="form-group"><div class="form-label">{{ t('ui_amount') }}</div><input class="input-field w-full" v-model.number="offlineActionForm.amount" :placeholder="t('ui_amount_placeholder')" type="number" min="0" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-danger" @click="offlineDoRemoveMoney">{{ t('ui_remove') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'ban'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-ban"></i> {{ t('ui_offline_ban') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_reason') }}</div><input class="input-field w-full" v-model="offlineActionForm.reason" :placeholder="t('ui_ban_reason')" /></div>
                <div class="form-group"><div class="form-label">{{ t('ui_duration') }}</div><select class="input-field w-full" v-model="offlineActionForm.duration"><option v-for="opt in banDurations" :key="opt.seconds" :value="opt.seconds">{{ opt.label }}</option></select></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-danger" @click="offlineDoBan">{{ t('ui_ban_player') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'warn'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-exclamation-triangle"></i> {{ t('ui_offline_warn') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_reason') }}</div><input class="input-field w-full" v-model="offlineActionForm.reason" :placeholder="t('ui_warning_reason')" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="offlineDoWarn">{{ t('ui_issue_warning') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'giveitem'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-box"></i> {{ t('ui_add_item') }}</h3>
                <div class="form-group"><input class="input-field w-full mb-2" v-model="offlineItemSearch" :placeholder="t('ui_search_item')" /></div>
                <div class="item-list-container" style="height:200px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:6px;padding:4px;margin-bottom:12px;">
                    <div v-for="item in filteredOfflineAllItems" :key="item.name" @click="selectOfflineItem(item)" class="item-list-row" :style="offlineActionForm.itemName === item.name ? 'background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);' : ''" style="display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-radius:6px;border:1px solid transparent;transition:all 0.15s ease;margin-bottom:2px;">
                        <img v-if="item.image" :src="item.image" style="width:32px;height:32px;object-fit:contain;" />
                        <div style="flex:1;">
                            <div style="font-weight:600;font-size:13px;color:white;">{{ item.label }}</div>
                            <div style="font-size:10px;opacity:0.6;color:var(--text-muted);">{{ item.name }}</div>
                        </div>
                    </div>
                </div>
                <div class="form-group"><div class="form-label">{{ t('ui_amount') }}</div><input class="input-field w-full" type="number" v-model.number="offlineActionForm.amount" :placeholder="t('ui_amount_placeholder')" min="1" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="offlineDoGiveItem" :disabled="!offlineActionForm.itemName">{{ t('ui_add') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'spawnvehicle'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-car"></i> {{ t('ui_add_vehicle') }}</h3>
                <div class="form-group"><div class="form-label">{{ t('ui_vehicle_model') }}</div><input class="input-field w-full" v-model="offlineActionForm.vehicleModel" :placeholder="t('ui_vehicle_model_short')" /></div>
                <div class="form-group"><div class="form-label">{{ t('ui_custom_plate') }}</div><input class="input-field w-full" v-model="offlineActionForm.plate" :placeholder="t('ui_custom_plate_placeholder')" maxlength="8" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-primary" @click="offlineDoSpawnVehicle" :disabled="!offlineActionForm.vehicleModel">{{ t('ui_add') }}</button></div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'setpos'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-map-marker-alt"></i> {{ t('ui_set_offline_position') }}</h3>
                <div class="form-group">
                    <div class="form-label">{{ t('ui_coordinates') }}</div>
                    <div style="display:flex; gap:6px;">
                        <input class="input-field w-full" type="number" step="0.01" v-model.number="offlineActionForm.coords.x" placeholder="X" />
                        <input class="input-field w-full" type="number" step="0.01" v-model.number="offlineActionForm.coords.y" placeholder="Y" />
                        <input class="input-field w-full" type="number" step="0.01" v-model.number="offlineActionForm.coords.z" placeholder="Z" />
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button>
                    <button class="btn-action btn-ghost" style="color: #60a5fa; border-color: rgba(96, 165, 250, 0.3);" @click="getAdminPos"><i class="fas fa-crosshairs"></i> {{ t('ui_get_my_pos') }}</button>
                    <button class="btn-action btn-primary" @click="offlineDoSetPos">{{ t('ui_update') }}</button>
                </div>
            </div>
        </div>
        <div v-if="offlineActionModal === 'removeitem'" class="modal-overlay" @click.self="offlineActionModal = null">
            <div class="modal-box">
                <h3><i class="fas fa-trash-alt"></i> {{ t('ui_remove_item') }}</h3>
                <p style="margin-bottom:12px; color:var(--text-muted); font-size:13px;">How many <strong>{{ offlineActionForm.itemLabel }}</strong> do you want to remove?</p>
                <div class="form-group"><div class="form-label">Amount (Max: {{ offlineActionForm.itemMax }})</div><input class="input-field w-full" type="number" v-model.number="offlineActionForm.amount" min="1" :max="offlineActionForm.itemMax" /></div>
                <div class="modal-actions"><button class="btn-action btn-ghost" @click="offlineActionModal = null">{{ t('ui_cancel') }}</button><button class="btn-action btn-danger" @click="offlineDoRemoveItem">{{ t('ui_remove') }}</button></div>
            </div>
        </div>
    </div>
    </script>
    <script src="./index.js"></script>
    <div id="controls-overlay"
        style="display:none; position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:99999; pointer-events:none;">
        <div
            style="background:linear-gradient(135deg, rgba(15,20,35,0.95), rgba(10,14,28,0.97)); border:1px solid rgba(59,130,246,0.15); border-radius:12px; padding:12px 20px; display:flex; align-items:center; gap:20px; font-family:'Inter','Segoe UI',sans-serif; box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);">
            <div id="controls-overlay-mode"
                style="font-size:12px; font-weight:700; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; white-space:nowrap;">
            </div>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.08);"></div>
            <div id="controls-overlay-keys"
                style="display:flex; align-items:center; gap:14px; font-size:11px; color:rgba(255,255,255,0.6);"></div>
        </div>
    </div>
</body>
</html>
